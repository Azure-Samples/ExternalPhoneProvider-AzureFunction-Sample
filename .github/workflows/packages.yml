name: Function ZIPs

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: function-zips-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22.x'
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11'
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: '8.0.x'
      - name: Test JavaScript
        working-directory: javascript
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npm test
      - name: Test Python
        working-directory: python
        run: |
          python -m pip install -r requirements.txt pytest
          python -m pytest tests
      - name: Test .NET
        run: dotnet test dotnet/tests/Epp.Otp.Tests.csproj
      - name: Build ZIPs
        shell: pwsh
        run: |
          ./package-javascript.ps1
          ./package-dotnet.ps1
          ./package-python.ps1
      - name: Verify existing ZIPs are never overwritten
        shell: pwsh
        run: |
          $packages = @{
            'package-javascript.ps1' = 'artifacts/javascript/released-package.zip'
            'package-dotnet.ps1' = 'artifacts/dotnet/released-package.zip'
            'package-python.ps1' = 'artifacts/python/released-package.zip'
          }
          foreach ($script in ($packages.Keys | Sort-Object)) {
            $archive = (Resolve-Path -LiteralPath $packages[$script]).Path
            $before = (Get-FileHash -LiteralPath $archive -Algorithm SHA256).Hash
            $rejected = $false
            try {
              & (Join-Path $PWD $script) -OutputPath $archive
            } catch {
              if (-not $_.Exception.Message.StartsWith('Output already exists:')) { throw }
              $rejected = $true
            }
            if (-not $rejected) { throw "$script did not reject an existing archive" }
            if ((Get-FileHash -LiteralPath $archive -Algorithm SHA256).Hash -ne $before) {
              throw "$script changed the existing archive"
            }
            Write-Host "$script rejected the existing output; SHA256 unchanged."
          }
      - name: Verify ZIPs and write checksums
        shell: pwsh
        run: |
          $required = @{
            javascript = @('host.json', 'src/functions/SendOtp.js', 'node_modules/@azure/functions/package.json')
            dotnet = @('host.json', 'dotnet.dll', 'functions.metadata', 'worker.config.json')
            python = @('host.json', 'function_app.py', 'requirements.txt', 'src/jwe.py', 'src/provider.py', '.python_packages/lib/site-packages/azure/functions/__init__.py')
          }
          $module = Import-Module ./setup/support/Epp.Setup.psm1 -Force -PassThru
          foreach ($language in ($required.Keys | Sort-Object)) {
            $name = 'released-package.zip'
            $directory = Join-Path 'artifacts' $language
            $path = Join-Path $directory $name
            & $module { param($Path, $Language); Assert-EppArchive -Path $Path -Language $Language -Kind ready } (Resolve-Path $path).Path $language
            $zip = [IO.Compression.ZipFile]::OpenRead((Resolve-Path $path))
            try {
              $entries = @($zip.Entries.FullName)
              foreach ($file in $required[$language]) {
                if ($file -notin $entries) { throw "Missing $file in $language/$name" }
              }
              $privateEntries = @($entries | Where-Object { $_ -cne '.python_packages/lib/site-packages/certifi/cacert.pem' })
              if ($privateEntries -match '(^|/)(local\.settings[^/]*|\.env[^/]*|\.git|\.venv|__pycache__)(/|$)|\.(pem|pfx|p12|key|publishsettings|pubxml)$') {
                throw "Private files in $language/$name"
              }
            } finally { $zip.Dispose() }
            '{0}  {1}' -f (Get-FileHash $path -Algorithm SHA256).Hash.ToLowerInvariant(), $name |
              Set-Content (Join-Path $directory 'SHA256SUMS.txt') -Encoding utf8
          }
      - name: Verify bundled Python dependencies and application imports
        shell: pwsh
        run: |
          $temporary = Join-Path ([IO.Path]::GetTempPath()) ('epp-package-check-' + [guid]::NewGuid().ToString('N'))
          try {
            [IO.Compression.ZipFile]::ExtractToDirectory((Resolve-Path 'artifacts/python/released-package.zip'), $temporary)
            $env:PYTHONPATH = Join-Path $temporary '.python_packages/lib/site-packages'
            Push-Location $temporary
            try {
              python -S -c "import azure.functions, azure.identity, azure.keyvault.secrets, requests, jwcrypto.jwe, function_app"
              if ($LASTEXITCODE -ne 0) { throw 'Packaged Python dependencies or application could not be imported' }
            } finally { Pop-Location }
          } finally {
            if (Test-Path -LiteralPath $temporary) { Remove-Item -LiteralPath $temporary -Recurse -Force }
          }
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: function-zips
          path: |
            artifacts/javascript/released-package.zip
            artifacts/javascript/SHA256SUMS.txt
            artifacts/dotnet/released-package.zip
            artifacts/dotnet/SHA256SUMS.txt
            artifacts/python/released-package.zip
            artifacts/python/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 14

  publish:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    strategy:
      matrix:
        language: [javascript, dotnet, python]
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: function-zips
          path: artifacts
      - name: Publish versioned ZIP downloads
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          COMMIT_SHA: ${{ github.sha }}
          RUN_NUMBER: ${{ github.run_number }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
          LANGUAGE: ${{ matrix.language }}
        run: |
          tag="epp-packages-${RUN_NUMBER}-${RUN_ATTEMPT}-${LANGUAGE}"
          gh release create "$tag" "artifacts/${LANGUAGE}/released-package.zip" "artifacts/${LANGUAGE}/SHA256SUMS.txt" \
            --target "$COMMIT_SHA" --title "EPP ${LANGUAGE} Function ZIP ${RUN_NUMBER}.${RUN_ATTEMPT}" \
            --latest=false \
            --notes "Packaged and tested from commit ${COMMIT_SHA} for ${LANGUAGE} on Linux x64. Download released-package.zip and verify this release's SHA256SUMS.txt. Configure the matching runtime, app settings, Key Vault access, and Easy Auth separately. No cloud deployment or live provider verification is performed."