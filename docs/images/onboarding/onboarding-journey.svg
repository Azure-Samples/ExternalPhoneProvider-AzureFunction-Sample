<svg xmlns="http://www.w3.org/2000/svg" width="960" height="290" viewBox="0 0 960 290" role="img" aria-labelledby="title description">
  <title id="title">The path to your first endpoint</title>
  <desc id="description">Five stages: confirm access and owners, register the endpoint application, review and run guided setup, connect the provider and complete authorized tests, then have the policy administrator activate and hand over. Setup deploys resources and code; it does not complete the later stages.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 10 5 0 10Z" fill="#245b91"/></marker>
    <style>
      text { font-family: "Segoe UI", Arial, sans-serif; fill: #172b40; font-size: 18px; }
      .title { font-size: 30px; font-weight: 700; }
      .heading { font-size: 21px; font-weight: 650; }
      .step { fill: #f1f6fc; stroke: #7595b7; stroke-width: 1.5; }
      .number { fill: #245b91; }
      .number-text { fill: white; font-size: 18px; font-weight: 700; text-anchor: middle; }
      .line { stroke: #245b91; stroke-width: 2; marker-end: url(#arrow); }
    </style>
  </defs>
  <rect width="960" height="290" fill="white"/>
  <text x="32" y="42" class="title">The path to your first endpoint</text>
  <text x="32" y="73">Follow the stages in order; activate only after testing.</text>

  <rect x="32" y="105" width="168" height="128" rx="10" class="step"/>
  <circle cx="56" cy="105" r="17" class="number"/><text x="56" y="111" class="number-text">1</text>
  <text x="48" y="146" class="heading">Get ready</text>
  <text x="48" y="200">Access + owners</text>

  <rect x="214" y="105" width="168" height="128" rx="10" class="step"/>
  <circle cx="238" cy="105" r="17" class="number"/><text x="238" y="111" class="number-text">2</text>
  <text x="230" y="146" class="heading">Register app</text>
  <text x="230" y="200">App client ID</text>

  <rect x="396" y="105" width="168" height="128" rx="10" fill="#e4f1ff" stroke="#245b91" stroke-width="2"/>
  <circle cx="420" cy="105" r="17" class="number"/><text x="420" y="111" class="number-text">3</text>
  <text x="412" y="146" class="heading">Run setup</text>
  <text x="412" y="200">Review + approve</text>

  <rect x="578" y="105" width="168" height="128" rx="10" class="step"/>
  <circle cx="602" cy="105" r="17" class="number"/><text x="602" y="111" class="number-text">4</text>
  <text x="594" y="146" class="heading">Connect + test</text>
  <text x="594" y="200">Provider + caller</text>

  <rect x="760" y="105" width="168" height="128" rx="10" class="step"/>
  <circle cx="784" cy="105" r="17" class="number"/><text x="784" y="111" class="number-text">5</text>
  <text x="776" y="146" class="heading">Activate +</text>
  <text x="776" y="173" class="heading">hand over</text>
  <text x="776" y="210">Policy admin</text>

  <path d="M201 169H212" class="line"/>
  <path d="M383 169H394" class="line"/>
  <path d="M565 169H576" class="line"/>
  <path d="M747 169H758" class="line"/>
  <text x="32" y="269">Setup deploys resources and code. Testing, activation and handover remain separate.</text>
</svg>
