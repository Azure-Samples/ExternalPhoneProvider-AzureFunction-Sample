<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-labelledby="title description">
  <title id="title">Example guided setup choices</title>
  <desc id="description">An illustrative selection summary uses a dedicated application, Telesign, tenant-detected Global routing, JavaScript, Flex Consumption FC1, and the contoso resource prefix. Final deployment requires explicit approval.</desc>
  <rect width="1200" height="420" rx="12" fill="#062f63"/>
  <rect width="1200" height="54" rx="12" fill="#e7f2ff"/>
  <text x="28" y="35" font-family="Segoe UI, Arial, sans-serif" font-size="21" fill="#172b4d" font-weight="600">Example choices - review the values for your own environment</text>
  <g font-family="Consolas, monospace" font-size="20" fill="#f1f6fb">
    <text x="30" y="102">Application</text><text x="360" y="102" fill="#a8f0ba">EPP Application</text>
    <text x="30" y="145">Provider</text><text x="360" y="145" fill="#a8f0ba">Telesign</text>
    <text x="30" y="188">Provider route</text><text x="360" y="188" fill="#a8f0ba">Global (detected from the tenant)</text>
    <text x="30" y="231">Runtime</text><text x="360" y="231" fill="#a8f0ba">JavaScript (default)</text>
    <text x="30" y="274">Hosting plan</text><text x="360" y="274" fill="#a8f0ba">Flex Consumption FC1</text>
    <text x="30" y="317">Resource prefix</text><text x="360" y="317" fill="#a8f0ba">contoso</text>
    <text x="30" y="376" fill="#ffe38b">Final approval: Yes or Y deploys. No, N, or Enter cancels.</text>
  </g>
</svg>
