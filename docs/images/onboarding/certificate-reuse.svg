<svg xmlns="http://www.w3.org/2000/svg" width="960" height="700" viewBox="0 0 960 700" role="img" aria-labelledby="title description">
  <title id="title">Certificate reuse: match the ID and the version</title>
  <desc id="description">After choosing Reuse, supply the encryption credential key ID from the application registration and the exact versioned certificate identifier from Key Vault. Setup checks the public certificate match and validity, then configures the Function's EPP_DECRYPTION_KEY_PEM setting with a pinned reference to the backing secret after approval. A certificate identifier is not a secret value, and certificate and secret version IDs need not match.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 10 5 0 10Z" fill="#245b91"/></marker>
    <style>
      text { font-family: "Segoe UI", Arial, sans-serif; fill: #172b40; font-size: 20px; }
      .title { font-size: 30px; font-weight: 700; }
      .heading { font-size: 23px; font-weight: 650; }
      .small { font-size: 18px; }
      .code { font-family: Consolas, monospace; font-size: 17px; }
      .line { fill: none; stroke: #245b91; stroke-width: 2.5; marker-end: url(#arrow); }
    </style>
  </defs>
  <rect width="960" height="700" fill="white"/>
  <text x="32" y="43" class="title">Certificate reuse: match the ID and the version</text>
  <text x="32" y="77" class="small">Choose Reuse first (-CertificateAction Reuse). Use your own application's key ID and vault version.</text>

  <rect x="32" y="112" width="420" height="205" rx="12" fill="#f1f6fc" stroke="#7595b7" stroke-width="1.5"/>
  <text x="56" y="150" class="heading">App registration</text>
  <text x="56" y="185">Manifest: keyCredentials</text>
  <text x="56" y="217">Select the encryption credential key ID.</text>
  <text x="56" y="254" class="code">Input: -EncryptionKeyId</text>
  <text x="56" y="288" class="small">Summary field: encryptionKeyId</text>

  <rect x="508" y="112" width="420" height="205" rx="12" fill="#fff7e8" stroke="#ae8741" stroke-width="1.5"/>
  <text x="532" y="150" class="heading">Key Vault certificate version</text>
  <text x="532" y="185">Certificates &gt; name &gt; exact version</text>
  <text x="532" y="217">Copy the Certificate Identifier.</text>
  <text x="532" y="254" class="code">Input: -KeyVaultCertificateId</text>
  <text x="532" y="288" class="code">.../certificates/&lt;name&gt;/&lt;version&gt;</text>

  <path d="M242 317V369" class="line"/>
  <path d="M718 317V369" class="line"/>
  <rect x="32" y="371" width="896" height="84" rx="12" fill="#edf7f1" stroke="#54856d" stroke-width="1.5"/>
  <text x="56" y="405" class="heading">Setup verifies the same public certificate and valid version</text>
  <text x="56" y="436">A matching name or newly renewed certificate alone is not sufficient.</text>

  <path d="M480 455V501" class="line"/>
  <text x="506" y="487" class="small">After plan approval</text>
  <rect x="32" y="503" width="896" height="120" rx="12" fill="#f1f6fc" stroke="#7595b7" stroke-width="1.5"/>
  <text x="56" y="539" class="heading">Function app setting: EPP_DECRYPTION_KEY_PEM</text>
  <text x="56" y="572">Setup resolves the backing secret; do not construct its URL yourself.</text>
  <text x="56" y="604" class="code">certificateSecretId: .../secrets/&lt;name&gt;/&lt;version&gt;</text>

  <text x="32" y="657" class="small">Certificate and secret version IDs need not match. An identifier is not a secret value.</text>
  <text x="32" y="687" class="small">Never copy or download the private key. Provider credentials are a separate configuration.</text>
</svg>
