<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1320" viewBox="0 0 1200 1320" role="img" aria-labelledby="title description">
  <title id="title">End-user sign-in: an SMS challenge</title>
  <desc id="description">Successful browser sign-in example after approved endpoint activation. A person opens an existing application, follows its redirect to Microsoft Entra ID, and reaches an SMS challenge. Microsoft Entra ID calls the protected SendOtp endpoint with its own caller token and encrypted payload. The endpoint validates, decrypts, and sends through the configured provider. The acceptance response and delivery to the person's phone are separate observations with no guaranteed ordering. The person enters the received code into the Microsoft Entra ID sign-in page. Microsoft Entra ID checks it and remaining policy requirements; the application validates the sign-in result and its own access rules. The endpoint does not verify the user's code or sign the user in.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 10 5 0 10Z" fill="#245b91"/></marker>
    <marker id="reply" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 10 5 0 10" fill="none" stroke="#21704d" stroke-width="1.5"/></marker>
    <style>
      text { font-family: "Segoe UI", Arial, sans-serif; fill: #172b40; font-size: 20px; }
      .title { font-size: 30px; font-weight: 700; }
      .heading { font-size: 21px; font-weight: 650; }
      .small { font-size: 18px; }
      .message { fill: none; stroke: #245b91; stroke-width: 2; marker-end: url(#arrow); }
      .reply { fill: none; stroke: #21704d; stroke-width: 2; stroke-dasharray: 7 5; marker-end: url(#reply); }
      .lifeline { stroke: #9aaabc; stroke-width: 1.5; stroke-dasharray: 6 6; }
    </style>
  </defs>
  <rect width="1200" height="1320" fill="white"/>
  <text x="32" y="43" class="title">End-user sign-in: an SMS challenge</text>
  <text x="32" y="76" class="small">Successful example after approved activation, not a live-run trace. Not every sign-in requires SMS.</text>

  <path d="M110 180V1170M350 180V1170M600 180V1170M850 180V1170M1090 180V1170" class="lifeline"/>
  <rect x="20" y="110" width="180" height="70" rx="8" fill="#fff7e8" stroke="#ae8741"/>
  <rect x="250" y="110" width="200" height="70" rx="8" fill="#f3effa" stroke="#8d75b0"/>
  <rect x="500" y="110" width="200" height="70" rx="8" fill="#e4f1ff" stroke="#7595b7"/>
  <rect x="750" y="110" width="200" height="70" rx="8" fill="#edf7f1" stroke="#54856d"/>
  <rect x="1000" y="110" width="180" height="70" rx="8" fill="#f3effa" stroke="#8d75b0"/>
  <text x="110" y="140" text-anchor="middle" class="heading">End user</text>
  <text x="110" y="166" text-anchor="middle" class="small">Browser + phone</text>
  <text x="350" y="140" text-anchor="middle" class="heading">Your application</text>
  <text x="350" y="166" text-anchor="middle" class="small">Existing sign-in app</text>
  <text x="600" y="151" text-anchor="middle" class="heading">Microsoft Entra ID</text>
  <text x="850" y="140" text-anchor="middle" class="heading">Your endpoint</text>
  <text x="850" y="166" text-anchor="middle" class="small">Easy Auth + Function</text>
  <text x="1090" y="151" text-anchor="middle" class="heading">Phone provider</text>

  <text x="230" y="218" text-anchor="middle" class="small">Open app / select Sign in</text>
  <path d="M110 234H348" class="message"/>
  <text x="230" y="270" text-anchor="middle" class="small">Redirect browser to sign-in</text>
  <path d="M350 286H112" class="reply"/>
  <rect x="140" y="300" width="430" height="27" fill="white"/>
  <text x="355" y="322" text-anchor="middle" class="small">Start sign-in and complete earlier prompts</text>
  <path d="M110 338H598" class="message"/>
  <rect x="130" y="352" width="450" height="27" fill="white"/>
  <text x="355" y="374" text-anchor="middle" class="small">Show SMS verification page when policy requires it</text>
  <path d="M600 390H112" class="reply"/>

  <text x="725" y="427" text-anchor="middle" class="small">POST /api/SendOtp</text>
  <text x="725" y="452" text-anchor="middle" class="small">channel: 1, mode: 1</text>
  <path d="M600 468H848" class="message"/>
  <rect x="664" y="488" width="516" height="68" rx="6" fill="#edf7f1" stroke="#54856d"/>
  <text x="688" y="516" class="small">Verify the Microsoft caller token, then validate and decrypt.</text>
  <text x="688" y="542" class="small">This is not the end user's token or a browser call.</text>
  <text x="970" y="591" text-anchor="middle" class="small">Send SMS (own credentials)</text>
  <path d="M850 607H1088" class="message"/>

  <rect x="32" y="633" width="1136" height="263" fill="none" stroke="#7595b7" stroke-width="1.5"/>
  <path d="M32 633H95V655L83 667H32Z" fill="#edf1f5" stroke="#7595b7"/>
  <text x="44" y="657" class="heading">par</text>
  <rect x="120" y="640" width="416" height="29" fill="white"/>
  <text x="132" y="661" class="small">[acceptance response; not a delivery receipt]</text>
  <text x="970" y="695" text-anchor="middle" class="small">Recognized acceptance</text>
  <path d="M1090 711H852" class="reply"/>
  <text x="725" y="749" text-anchor="middle" class="small">HTTP 200 + original nonce</text>
  <path d="M850 765H602" class="reply"/>
  <path d="M32 790H1168" stroke="#7595b7" stroke-dasharray="7 5"/>
  <rect x="120" y="798" width="602" height="29" fill="white"/>
  <text x="132" y="819" class="small">[separate recipient delivery; no guaranteed order with the response]</text>
  <rect x="326" y="839" width="548" height="26" fill="white"/>
  <text x="600" y="858" text-anchor="middle" class="small">SMS reaches the person's phone, if delivery succeeds</text>
  <path d="M1090 876H112" class="message"/>

  <rect x="112" y="917" width="486" height="27" fill="white"/>
  <text x="355" y="939" text-anchor="middle" class="small">Read SMS; enter code on the Microsoft Entra ID sign-in page</text>
  <path d="M110 955H598" class="message"/>
  <path d="M600 980H638V1020H602" class="message"/>
  <rect x="648" y="973" width="520" height="30" fill="white"/>
  <text x="658" y="995" class="small">Check the code and remaining sign-in requirements</text>
  <text x="475" y="1059" text-anchor="middle" class="small">Return sign-in result</text>
  <path d="M600 1075H352" class="reply"/>
  <text x="230" y="1114" text-anchor="middle" class="small">App checks result + access</text>
  <text x="230" y="1139" text-anchor="middle" class="small">Open app only if authorized</text>
  <path d="M350 1155H112" class="reply"/>

  <path d="M32 1192H1168" stroke="#c6d3df"/>
  <text x="32" y="1225" class="small">The Function delivers the supplied message; it does not verify the user's code or sign the user in.</text>
  <text x="32" y="1256" class="small">Evaluation (mode 2) stops after endpoint validation/decryption: no provider send and no user SMS.</text>
  <text x="32" y="1287" class="small">Earlier prompts, full token exchange, error paths and caller fallback are not expanded. Never blindly resend after a timeout.</text>
</svg>
