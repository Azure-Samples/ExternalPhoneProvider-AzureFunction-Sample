<svg xmlns="http://www.w3.org/2000/svg" width="960" height="1100" viewBox="0 0 960 1100" role="img" aria-labelledby="title description">
  <title id="title">UML sequence: one endpoint request</title>
  <desc id="description">Microsoft Entra ID sends a bearer token and encrypted request to Easy Auth. Authorized requests reach the Function, which validates and decrypts. In the evaluation branch, the Function returns success without contacting the provider. In the live branch, the Function sends with its own provider credentials and returns success only after recognized provider acceptance. Delivery to the recipient is separate, and failed requests omit the success nonce.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 10 5 0 10Z" fill="#245b91"/></marker>
    <marker id="reply" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 10 5 0 10" fill="none" stroke="#21704d" stroke-width="1.5"/></marker>
    <style>
      text { font-family: "Segoe UI", Arial, sans-serif; fill: #172b40; font-size: 19px; }
      .title { font-size: 30px; font-weight: 700; }
      .heading { font-size: 21px; font-weight: 650; }
      .small { font-size: 18px; }
      .message { fill: none; stroke: #245b91; stroke-width: 2; marker-end: url(#arrow); }
      .reply { fill: none; stroke: #21704d; stroke-width: 2; stroke-dasharray: 7 5; marker-end: url(#reply); }
      .lifeline { stroke: #9aaabc; stroke-width: 1.5; stroke-dasharray: 6 6; }
    </style>
  </defs>
  <rect width="960" height="1100" fill="white"/>
  <text x="32" y="43" class="title">UML sequence: one endpoint request</text>
  <text x="32" y="76" class="small">Read downward. Evaluation and live are alternatives, not consecutive sends.</text>

  <path d="M120 174V972M360 174V972M600 174V972M850 174V972" class="lifeline"/>
  <rect x="20" y="110" width="200" height="64" rx="8" fill="#e4f1ff" stroke="#7595b7"/>
  <rect x="260" y="110" width="200" height="64" rx="8" fill="#e4f1ff" stroke="#7595b7"/>
  <rect x="520" y="110" width="160" height="64" rx="8" fill="#edf7f1" stroke="#54856d"/>
  <rect x="760" y="110" width="180" height="64" rx="8" fill="#f3effa" stroke="#8d75b0"/>
  <text x="120" y="148" text-anchor="middle" class="heading">Microsoft Entra ID</text>
  <text x="360" y="148" text-anchor="middle" class="heading">Easy Auth</text>
  <text x="600" y="148" text-anchor="middle" class="heading">Function</text>
  <text x="850" y="148" text-anchor="middle" class="heading">Phone provider</text>

  <text x="240" y="222" text-anchor="middle" class="small">POST + token + JWE</text>
  <path d="M120 238H358" class="message"/>
  <rect x="32" y="268" width="896" height="45" rx="6" fill="#fff7e8" stroke="#ae8741"/>
  <text x="480" y="297" text-anchor="middle" class="small">Easy Auth verifies the token and caller. Rejected callers never reach the Function.</text>
  <text x="480" y="349" text-anchor="middle" class="small">Authorized request</text>
  <path d="M360 365H598" class="message"/>
  <path d="M600 405H644V447H602" class="message"/>
  <text x="666" y="417" class="small">Validate + decrypt</text>
  <text x="666" y="445" class="small">using the private key</text>

  <rect x="32" y="490" width="896" height="470" fill="none" stroke="#7595b7" stroke-width="1.5"/>
  <path d="M32 490H95V512L83 524H32Z" fill="#edf1f5" stroke="#7595b7"/>
  <text x="49" y="514" class="heading">alt</text>
  <rect x="112" y="497" width="254" height="32" fill="white"/>
  <text x="120" y="521" class="heading">[evaluation: mode 2]</text>
  <text x="480" y="563" text-anchor="middle" class="small">200 + original nonce</text>
  <path d="M600 579H362" class="reply"/>
  <text x="240" y="617" text-anchor="middle" class="small">200 + original nonce</text>
  <path d="M360 633H122" class="reply"/>
  <rect x="758" y="548" width="162" height="58" rx="6" fill="#edf7f1" stroke="#54856d"/>
  <text x="839" y="581" text-anchor="middle" class="small">No provider call</text>

  <path d="M32 665H928" stroke="#7595b7" stroke-dasharray="7 5"/>
  <rect x="112" y="675" width="180" height="32" fill="white"/>
  <text x="120" y="699" class="heading">[live: mode 1]</text>
  <text x="725" y="737" text-anchor="middle" class="small">Send SMS or voice</text>
  <path d="M600 753H848" class="message"/>
  <text x="725" y="797" text-anchor="middle" class="small">Recognized acceptance</text>
  <path d="M850 813H602" class="reply"/>
  <text x="480" y="857" text-anchor="middle" class="small">200 + original nonce</text>
  <path d="M600 873H362" class="reply"/>
  <text x="240" y="917" text-anchor="middle" class="small">200 + original nonce</text>
  <path d="M360 933H122" class="reply"/>

  <text x="32" y="1005" class="small">Success also includes correlationId and providerStatus: "accepted". Failures omit the nonce.</text>
  <text x="32" y="1036" class="small">Live sends use provider credentials, never the incoming bearer token.</text>
  <text x="32" y="1067" class="small">Recipient delivery is checked separately, not awaited. A timeout is not permission to resend.</text>
</svg>
