# Azure DevOps Azure Pipelines YAML. This is not a GitHub Actions workflow.
trigger:
  batch: true
  branches:
    include:
    - main

pr:
  branches:
    include:
    - main

parameters:
- name: deployDevelopment
  displayName: Deploy one CYOT development endpoint (blocked until E2E inventory is configured)
  type: boolean
  default: false
- name: deploymentLanguage
  displayName: Runtime to deploy when deployment is enabled
  type: string
  default: javascript
  values:
  - javascript
  - dotnet
  - python
- name: targets
  displayName: Reviewed existing Linux Function Apps
  type: object
  default:
  - language: javascript
    appName: REQUIRED
    resourceGroup: REQUIRED
    applicationId: REQUIRED
    audience: REQUIRED
    location: REQUIRED
    servicePlan: REQUIRED
  - language: dotnet
    appName: REQUIRED
    resourceGroup: REQUIRED
    applicationId: REQUIRED
    audience: REQUIRED
    location: REQUIRED
    servicePlan: REQUIRED
  - language: python
    appName: REQUIRED
    resourceGroup: REQUIRED
    applicationId: REQUIRED
    audience: REQUIRED
    location: REQUIRED
    servicePlan: REQUIRED

stages:
- stage: ValidateAndPackage
  displayName: Validate and package
  jobs:
  - job: SetupWindows
    displayName: Setup tests on Windows
    pool:
      vmImage: windows-latest
    steps:
    - checkout: self
      clean: true
    - pwsh: |
        $ErrorActionPreference = 'Stop'
        Get-ChildItem ./setup/tests -Filter '*.Tests.ps1' | Where-Object Name -ne 'ServicePlans.Tests.ps1' | Sort-Object Name | ForEach-Object {
          Write-Host "Running $($_.Name)"
          & $_.FullName
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
        }
      displayName: Run setup tests

  - job: BuildLinux
    displayName: Test and build all runtime packages
    dependsOn: SetupWindows
    pool:
      vmImage: ubuntu-latest
    workspace:
      clean: all
    steps:
    - checkout: self
      clean: true
    - task: UseNode@1
      inputs:
        version: 20.x
    - script: |
        npm ci --ignore-scripts --no-audit --no-fund
        npm test
      workingDirectory: javascript
      displayName: Test JavaScript on Node.js 20
    - task: UseNode@1
      inputs:
        version: 22.x
    - task: UseDotNet@2
      inputs:
        packageType: sdk
        version: 10.0.x
    - task: UsePythonVersion@0
      inputs:
        versionSpec: '3.11'
        architecture: x64
    - pwsh: |
        $ErrorActionPreference = 'Stop'
        Get-ChildItem ./setup/tests -Filter '*.Tests.ps1' | Where-Object Name -ne 'ServicePlans.Tests.ps1' | Sort-Object Name | ForEach-Object {
          Write-Host "Running $($_.Name)"
          & $_.FullName
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
        }
      displayName: Run setup tests on Linux
    - pwsh: |
        $ErrorActionPreference = 'Stop'
        az bicep install
        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
        az bicep build --file ./setup/infra/main.bicep --outfile "$(Agent.TempDirectory)/cyot-main.json"
        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
        ./setup/tests/ServicePlans.Tests.ps1 -TemplatePath "$(Agent.TempDirectory)/cyot-main.json"
      displayName: Compile and test Bicep
    - script: |
        npm ci --ignore-scripts --no-audit --no-fund
        npm test
      workingDirectory: javascript
      displayName: Test JavaScript on Node.js 22
    - script: dotnet test tests/Epp.Otp.Tests.csproj --configuration Release --logger trx --results-directory "$(Agent.TempDirectory)/dotnet-tests"
      workingDirectory: dotnet
      displayName: Test .NET
    - script: |
        python -m pip install -r requirements.txt pytest
        python -m pytest tests --junitxml="$(Agent.TempDirectory)/python-tests.xml"
      workingDirectory: python
      displayName: Test Python
    - pwsh: |
        $ErrorActionPreference = 'Stop'
        ./package-javascript.ps1
        ./package-dotnet.ps1
        ./package-python.ps1

        $required = @{
          javascript = @('host.json', 'src/functions/SendOtp.js', 'node_modules/@azure/functions/package.json')
          dotnet = @('host.json', 'dotnet.dll', 'functions.metadata', 'worker.config.json')
          python = @('host.json', 'function_app.py', 'requirements.txt', 'src/jwe.py', 'src/provider.py', '.python_packages/lib/site-packages/azure/functions/__init__.py')
        }
        $module = Import-Module ./setup/support/Epp.Setup.psm1 -Force -PassThru
        $manifest = [ordered]@{
          sourceCommit = '$(Build.SourceVersion)'
          pipelineRun = '$(Build.BuildId)'
          packages = [ordered]@{}
        }
        foreach ($language in @('javascript', 'dotnet', 'python')) {
          $zip = Join-Path 'artifacts' "$language/released-package.zip"
          if (-not (Test-Path -LiteralPath $zip)) { throw "Missing package for $language." }
          & $module { param($Path, $Language); Assert-EppArchive -Path $Path -Language $Language -Kind ready } (Resolve-Path $zip).Path $language
          $archive = [IO.Compression.ZipFile]::OpenRead((Resolve-Path $zip))
          try {
            $entries = @($archive.Entries.FullName)
            foreach ($entry in $required[$language]) {
              if ($entry -notin $entries) { throw "Missing $entry in the $language package." }
            }
            $privateEntries = @($entries | Where-Object { $_ -cne '.python_packages/lib/site-packages/certifi/cacert.pem' })
            if ($privateEntries -match '(^|/)(local\.settings[^/]*|\.env[^/]*|\.git|\.venv|__pycache__)(/|$)|\.(pem|pfx|p12|key|publishsettings|pubxml)$') {
              throw "Private files found in the $language package."
            }
          } finally { $archive.Dispose() }
          $manifest.packages[$language] = (Get-FileHash -LiteralPath $zip -Algorithm SHA256).Hash.ToLowerInvariant()
        }
        $manifest | ConvertTo-Json -Depth 4 | Set-Content ./artifacts/release-manifest.json -Encoding utf8
      displayName: Build packages and release manifest
    - pwsh: |
        $ErrorActionPreference = 'Stop'
        $temporary = Join-Path '$(Agent.TempDirectory)' ('cyot-python-package-' + [guid]::NewGuid().ToString('N'))
        try {
          [IO.Compression.ZipFile]::ExtractToDirectory((Resolve-Path './artifacts/python/released-package.zip'), $temporary)
          $env:PYTHONPATH = Join-Path $temporary '.python_packages/lib/site-packages'
          Push-Location $temporary
          try {
            python -S -c "import azure.functions, azure.identity, azure.keyvault.secrets, requests, jwcrypto.jwe, function_app"
            if ($LASTEXITCODE -ne 0) { throw 'Packaged Python dependencies or application could not be imported.' }
          } finally { Pop-Location }
        } finally {
          if (Test-Path -LiteralPath $temporary) { Remove-Item -LiteralPath $temporary -Recurse -Force }
        }
      displayName: Verify packaged Python imports
    - task: PublishTestResults@2
      condition: succeededOrFailed()
      inputs:
        testResultsFormat: VSTest
        testResultsFiles: $(Agent.TempDirectory)/dotnet-tests/*.trx
        failTaskOnFailedTests: true
        failTaskOnMissingResultsFile: true
        testRunTitle: CYOT .NET tests
    - task: PublishTestResults@2
      condition: succeededOrFailed()
      inputs:
        testResultsFormat: JUnit
        testResultsFiles: $(Agent.TempDirectory)/python-tests.xml
        failTaskOnFailedTests: true
        failTaskOnMissingResultsFile: true
        testRunTitle: CYOT Python tests
    - task: PublishPipelineArtifact@1
      inputs:
        targetPath: $(Build.SourcesDirectory)/artifacts
        artifactName: cyot-packages
      displayName: Publish immutable CYOT packages

- ${{ if eq(parameters.deployDevelopment, true) }}:
  - stage: DeployDevelopment
    displayName: Deploy and verify development
    dependsOn: ValidateAndPackage
    condition: and(succeeded(), eq(variables['Build.SourceBranch'], 'refs/heads/main'), eq(variables['Build.Reason'], 'Manual'), eq(variables['CyotE2EReady'], 'true'))
    lockBehavior: sequential
    variables:
    - group: ExternalPhoneProvider-e2e-config
    jobs:
    - deployment: DeployCYOT
      displayName: Deploy CYOT endpoints
      environment: cyote2e-test
      pool:
        vmImage: ubuntu-latest
      strategy:
        runOnce:
          deploy:
            steps:
            - checkout: none
            - download: current
              artifact: cyot-packages
            - task: AzureCLI@2
              displayName: Verify Azure target and packages
              inputs:
                azureSubscription: cyote2e-deployment-v2
                scriptType: pscore
                scriptLocation: inlineScript
                inlineScript: |
                  $ErrorActionPreference = 'Stop'
                  $account = az account show --output json | ConvertFrom-Json
                  if ($LASTEXITCODE -ne 0) { throw 'Unable to read the Azure service connection context.' }
                  $tenantId = [guid]::Empty
                  $subscriptionId = [guid]::Empty
                  $callerId = [guid]::Empty
                  if (-not [guid]::TryParse($env:EXPECTED_TENANT, [ref]$tenantId) -or
                      -not [guid]::TryParse($env:EXPECTED_SUBSCRIPTION, [ref]$subscriptionId) -or
                      -not [guid]::TryParse($env:CALLER_CLIENT_ID, [ref]$callerId) -or
                      $tenantId -eq [guid]::Empty -or $subscriptionId -eq [guid]::Empty -or $callerId -eq [guid]::Empty) {
                    throw 'The configured tenant, subscription, and caller IDs must be nonzero GUIDs.'
                  }
                  if ($account.environmentName -cne 'AzureCloud' -or
                      $account.tenantId -cne $tenantId.ToString() -or $account.id -cne $subscriptionId.ToString()) {
                    throw 'The service connection targets the wrong tenant or subscription.'
                  }
                  $artifact = '$(Pipeline.Workspace)/cyot-packages'
                  $manifest = Get-Content (Join-Path $artifact 'release-manifest.json') -Raw | ConvertFrom-Json
                  if ($manifest.sourceCommit -cne '$(Build.SourceVersion)' -or $manifest.pipelineRun -cne '$(Build.BuildId)') {
                    throw 'The package manifest does not match this pipeline run.'
                  }
                  $targets = @($env:TARGETS_JSON | ConvertFrom-Json)
                  $appNames = @($targets.appName)
                  $languages = @($targets.language | Sort-Object)
                  if ($targets.Count -ne 3 -or ($languages -join ',') -cne 'dotnet,javascript,python' -or
                      $appNames -contains 'REQUIRED' -or @($appNames | Sort-Object -Unique).Count -ne 3) {
                    throw 'Queue the pipeline with exactly one distinct app for each supported language.'
                  }
                  $selectedTargets = @($targets | Where-Object { $_.language -ceq $env:DEPLOYMENT_LANGUAGE })
                  if ($selectedTargets.Count -ne 1) { throw 'The selected deployment language must resolve to exactly one target.' }
                  foreach ($language in @('javascript', 'dotnet', 'python')) {
                    $zip = Join-Path $artifact "$language/released-package.zip"
                    $actual = (Get-FileHash -LiteralPath $zip -Algorithm SHA256).Hash.ToLowerInvariant()
                    if ($manifest.packages.$language -cne $actual) { throw "Package digest mismatch for $language." }
                  }
                  foreach ($target in $targets) {
                    $expectedTargetProperties = @('language', 'appName', 'resourceGroup', 'applicationId', 'audience', 'location', 'servicePlan')
                    $actualTargetProperties = @($target.PSObject.Properties.Name | Sort-Object)
                    if (($actualTargetProperties -join ',') -cne (($expectedTargetProperties | Sort-Object) -join ',') -or
                        @($expectedTargetProperties | Where-Object { $target.$_ -isnot [string] -or [string]::IsNullOrWhiteSpace($target.$_) }).Count -ne 0) {
                      throw 'Each target must contain exactly seven nonblank scalar string properties.'
                    }
                    $applicationId = [guid]::Empty
                    if ($target.appName -cnotmatch '^[A-Za-z0-9][A-Za-z0-9-]{1,58}[A-Za-z0-9]$' -or
                      $target.resourceGroup -cnotmatch '^[A-Za-z0-9._()-]{1,90}$' -or $target.resourceGroup -eq 'REQUIRED' -or
                        -not [guid]::TryParse([string]$target.applicationId, [ref]$applicationId) -or
                        $applicationId -eq [guid]::Empty -or $target.audience -eq 'REQUIRED' -or
                        $target.location -cnotmatch '^[a-z0-9]+$' -or $target.location -eq 'REQUIRED' -or
                        $target.servicePlan -cne 'FC1') {
                      throw 'Every Phase 1 target requires a valid app name, application ID, audience, region, and the reviewed FC1 plan.'
                    }
                    az group show --name $target.resourceGroup --only-show-errors --output none
                    if ($LASTEXITCODE -ne 0) { throw 'A target resource group does not exist or is not accessible.' }
                    $appUrl = "https://management.azure.com/subscriptions/$subscriptionId/resourceGroups/$($target.resourceGroup)/providers/Microsoft.Web/sites/$($target.appName)?api-version=2024-04-01"
                    $app = az rest --method get --url $appUrl --output json | ConvertFrom-Json
                    if ($LASTEXITCODE -ne 0 -or -not $app.properties.httpsOnly -or $app.kind -notmatch 'functionapp' -or $app.kind -notmatch 'linux') {
                      throw 'A target is missing, is not a Linux Function App, or does not require HTTPS.'
                    }
                    if ($app.tags.managedBy -cne 'EPP-Setup' -or $app.tags.eppLanguage -cne $target.language -or
                        $app.tags.eppApplicationId -cne $applicationId.ToString() -or $app.tags.eppServicePlan -cne $target.servicePlan) {
                      throw 'A target does not match the reviewed setup inventory.'
                    }
                    if ($app.location.Replace(' ', '').ToLowerInvariant() -cne $target.location) {
                      throw 'A target region does not match the reviewed value.'
                    }
                    $plan = az resource show --ids $app.properties.serverFarmId --api-version 2024-04-01 --output json | ConvertFrom-Json
                    if ($LASTEXITCODE -ne 0 -or $plan.sku.name -cne $target.servicePlan) {
                      throw 'A target hosting-plan SKU does not match its reviewed value.'
                    }
                    $runtime = @{ javascript = 'node'; dotnet = 'dotnet-isolated'; python = 'python' }[$target.language]
                    $runtimeVersion = @{ javascript = '22'; dotnet = '10.0'; python = '3.11' }[$target.language]
                    if ($app.properties.functionAppConfig.runtime.name -cne $runtime -or
                        $app.properties.functionAppConfig.runtime.version -cne $runtimeVersion) {
                      throw 'An FC1 target runtime does not match its package language.'
                    }
                    $deploymentStorage = $app.properties.functionAppConfig.deployment.storage
                    if ($deploymentStorage.type -cne 'blobContainer' -or
                        $deploymentStorage.authentication.type -cne 'SystemAssignedIdentity' -or
                        $deploymentStorage.value -cnotmatch '^https://[a-z0-9]{3,24}\.blob\.core\.windows\.net/packages/?$' -or
                        -not $app.identity.principalId -or $app.properties.publicNetworkAccess -cne 'Enabled') {
                      throw 'An FC1 target does not have the expected identity-based deployment storage or public deployment access.'
                    }
                    $settings = az rest --method post --url "$($app.id)/config/appsettings/list?api-version=2024-04-01" --output json | ConvertFrom-Json
                    if ($LASTEXITCODE -ne 0 -or
                        $settings.properties.AzureWebJobsStorage__credential -cne 'managedidentity' -or
                        -not $settings.properties.AzureWebJobsStorage__accountName -or
                        $settings.properties.WEBSITE_RUN_FROM_PACKAGE -or
                        $settings.properties.SCM_DO_BUILD_DURING_DEPLOYMENT -eq 'true' -or
                        $settings.properties.ENABLE_ORYX_BUILD -eq 'true') {
                      throw 'An FC1 target has missing or incompatible host settings.'
                    }
                    $auth = az rest --method get --url "$($app.id)/config/authsettingsV2?api-version=2024-04-01" --output json | ConvertFrom-Json
                    $aad = $auth.properties.identityProviders.azureActiveDirectory
                    $otherBuiltInProviders = @($auth.properties.identityProviders.PSObject.Properties | Where-Object {
                      $_.Name -cne 'azureActiveDirectory' -and $_.Value -and $_.Value.enabled
                    })
                    $enabledCustomProviders = @($auth.properties.identityProviders.customOpenIdConnectProviders.PSObject.Properties | Where-Object {
                      $_.Value -and $_.Value.enabled
                    })
                    $normalizedTenant = $tenantId.ToString()
                    $expectedIssuers = @(
                      "https://login.microsoftonline.com/$normalizedTenant/v2.0"
                      "https://sts.windows.net/$normalizedTenant/"
                    )
                    $allowedCallers = @($aad.validation.defaultAuthorizationPolicy.allowedApplications)
                    $allowedAudiences = @($aad.validation.allowedAudiences)
                    if (-not $auth.properties.platform.enabled -or -not $auth.properties.globalValidation.requireAuthentication -or
                        $auth.properties.globalValidation.unauthenticatedClientAction -ne 'Return401' -or
                        @($auth.properties.globalValidation.excludedPaths).Where({ $_ }).Count -ne 0 -or
                        -not $auth.properties.httpSettings.requireHttps -or -not $aad.enabled -or
                        $otherBuiltInProviders.Count -ne 0 -or $enabledCustomProviders.Count -ne 0 -or
                        $aad.registration.clientId -cne $applicationId.ToString() -or
                        $aad.registration.openIdIssuer.TrimEnd('/') -notin @($expectedIssuers.ForEach({ $_.TrimEnd('/') })) -or
                        $allowedAudiences.Count -ne 1 -or $allowedAudiences[0] -cne $target.audience -or
                        $allowedCallers.Count -ne 1 -or $allowedCallers[0] -cne $callerId.ToString()) {
                      throw 'A target does not have the expected Easy Auth caller policy.'
                    }
                  }
                  Write-Host 'Azure target, package digests, and Easy Auth passed preflight.'
              env:
                TARGETS_JSON: ${{ convertToJson(parameters.targets) }}
                EXPECTED_TENANT: $(CyotTenantId)
                EXPECTED_SUBSCRIPTION: $(CyotSubscriptionId)
                CALLER_CLIENT_ID: $(CyotCallerClientId)
                DEPLOYMENT_LANGUAGE: ${{ parameters.deploymentLanguage }}
            - task: AzureCLI@2
              displayName: Deploy selected FC1 CYOT package and verify registration
              inputs:
                azureSubscription: cyote2e-deployment-v2
                scriptType: pscore
                scriptLocation: inlineScript
                inlineScript: |
                  $ErrorActionPreference = 'Stop'
                  $targets = @($env:TARGETS_JSON | ConvertFrom-Json)
                  $target = @($targets | Where-Object { $_.language -ceq $env:DEPLOYMENT_LANGUAGE })
                  if ($target.Count -ne 1) { throw 'The selected deployment target is invalid.' }
                  $package = Join-Path '$(Pipeline.Workspace)/cyot-packages' "$($target.language)/released-package.zip"
                  az functionapp deployment source config-zip --resource-group $target.resourceGroup --name $target.appName `
                    --src $package --build-remote false --timeout 1800 --only-show-errors --output none
                  if ($LASTEXITCODE -ne 0) { throw 'FC1 package deployment failed.' }

                  $app = az functionapp show --resource-group $target.resourceGroup --name $target.appName --output json | ConvertFrom-Json
                  if ($LASTEXITCODE -ne 0 -or -not $app.id) { throw 'Unable to read the deployed Function App.' }
                  $synchronized = $false
                  for ($attempt = 1; $attempt -le 12; $attempt++) {
                    $syncOutput = @(& az rest --method post --url "https://management.azure.com$($app.id)/syncfunctiontriggers?api-version=2024-04-01" `
                      --only-show-errors --output none 2>&1)
                    if ($LASTEXITCODE -eq 0) { $synchronized = $true; break }
                    $transient = ($syncOutput -join ' ') -match 'BadGateway|ServiceUnavailable|GatewayTimeout|InternalServerError|502|503|504'
                    if (-not $transient -or $attempt -eq 12) { break }
                    Start-Sleep -Seconds 10
                  }
                  if (-not $synchronized) { throw 'Function trigger synchronization failed.' }

                  $registered = $false
                  $expectedFunctionName = if ($target.language -ceq 'python') { 'send_otp' } else { 'SendOtp' }
                  for ($attempt = 1; $attempt -le 6; $attempt++) {
                    $functions = @(az functionapp function list --resource-group $target.resourceGroup --name $target.appName `
                      --only-show-errors --output json | ConvertFrom-Json)
                    if ($LASTEXITCODE -eq 0 -and @($functions | Where-Object { $_.name -match "(^|/)$([regex]::Escape($expectedFunctionName))$" }).Count -eq 1) {
                      $registered = $true
                      break
                    }
                    if ($attempt -lt 6) { Start-Sleep -Seconds 10 }
                  }
                  if (-not $registered) { throw 'The deployed package did not register exactly one expected CYOT function.' }
              env:
                TARGETS_JSON: ${{ convertToJson(parameters.targets) }}
                DEPLOYMENT_LANGUAGE: ${{ parameters.deploymentLanguage }}
            - task: AzureCLI@2
              displayName: Verify selected endpoint rejects anonymous requests
              inputs:
                azureSubscription: cyote2e-deployment-v2
                scriptType: pscore
                scriptLocation: inlineScript
                inlineScript: |
                  $ErrorActionPreference = 'Stop'
                  $targets = @($env:TARGETS_JSON | ConvertFrom-Json)
                  $target = @($targets | Where-Object { $_.language -ceq $env:DEPLOYMENT_LANGUAGE })
                  if ($target.Count -ne 1) { throw 'The selected deployment target is invalid.' }
                  $hostName = az functionapp show --resource-group $target.resourceGroup --name $target.appName --query defaultHostName --output tsv
                  if ($LASTEXITCODE -ne 0 -or -not $hostName) { throw 'Unable to read the deployed Function hostname.' }
                  $response = Invoke-WebRequest -Uri "https://$hostName/api/SendOtp" -Method Post -ContentType 'application/json' `
                    -Body '{}' -SkipHttpErrorCheck -MaximumRedirection 0 -TimeoutSec 30
                  if ($response.StatusCode -ne 401) { throw 'The CYOT endpoint did not reject an anonymous request with HTTP 401.' }
                  Write-Host 'The selected CYOT endpoint registered SendOtp and requires authentication. SAS Synthetics owns encrypted evaluation monitoring.'
              env:
                TARGETS_JSON: ${{ convertToJson(parameters.targets) }}
                DEPLOYMENT_LANGUAGE: ${{ parameters.deploymentLanguage }}
